<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom right, #6b7280, #9ca3af, #d1d5db);
      font-family: 'Segoe UI', sans-serif;
    }

    .signup-card {
      background: rgba(243, 244, 246, 0.95);
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgba(0,0,0,0.25);
      max-width: 900px;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
    }

    /* Image side */
    .signup-card .image-side {
      flex: 1 1 45%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-color: #f3f4f6;
    }

    .signup-card .image-side img {
      width: 100%;
      max-width: 550px; /* bigger image */
      border-radius: 0.75rem;
      object-fit: cover;
    }

    /* Form side */
    .signup-card .form-side {
      flex: 1 1 55%;
      padding: 2.5rem;
    }

    .btn-gradient {
      background: linear-gradient(to right, #ef4444, #b91c1c);
      color: white;
      font-weight: bold;
    }

    .btn-gradient:hover {
      transform: scale(1.05);
      transition: transform 0.3s;
    }

    .text-accent {
      color: #ef4444;
      font-weight: 600;
    }

    label {
      color: #374151;
    }

    .form-control {
      background-color: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
    }

    .form-control:focus {
      border-color: #9ca3af;
      box-shadow: none;
    }

    hr {
      border-color: #9ca3af;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .signup-card {
        flex-direction: column;
      }
      .signup-card .image-side {
        display: block;
        width: 100%;
        padding: 1rem;
      }
      .signup-card .image-side img {
        max-width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>

<div class="signup-card">
  <!-- Image side -->
  <div class="image-side">
    <img src="image.png" alt="Sign Up Illustration">
  </div>

  <!-- Form side -->
  <div class="form-side">
    <h2 class="text-center mb-3 fw-bold text-gray-800">Sign Up</h2>
    <p class="text-center text-gray-600 mb-4">Create an account to get started</p>

    <form #signupForm="ngForm" (ngSubmit)="onSubmit(signupForm)">
      <!-- Username -->
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter your username" ngModel required>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="Enter your email" ngModel required>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter your password" ngModel required>
      </div>

      <!-- Confirm Password -->
      <div class="mb-4">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Confirm your password" ngModel required>
      </div>

      <button type="submit" class="btn btn-gradient w-100 mb-4 py-2">Sign Up</button>

      <!-- Divider -->
      <div class="d-flex align-items-center mb-4">
        <hr class="flex-grow-1">
        <span class="px-2 text-gray-500">OR</span>
        <hr class="flex-grow-1">
      </div>

      <!-- Login link -->
      <p class="text-center text-gray-600 mb-0">
        Already have an account?
        <a href="#" class="text-accent fw-semibold">Log In</a>
      </p>
    </form>
  </div>
</div>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
