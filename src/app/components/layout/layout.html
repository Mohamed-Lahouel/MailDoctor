<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Validation Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 280px; /* increased width */
      background: #f8f9fa; /* light grey touch */
      box-shadow: 2px 0 6px rgba(0,0,0,0.1);
      padding: 2rem 1.5rem;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: fixed;
      left: 0;
      top: 0;
      border-radius: 0 0.5rem 0.5rem 0;
    }

    .sidebar-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 2rem;
    }

    .nav-link {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      color: #374151;
      font-weight: 500;
      border-radius: 0.375rem;
      transition: all 0.2s;
      margin-bottom: 0.5rem;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-link:hover {
      background: #ef4444;
      color: white;
    }

    .nav-link.active {
      background: linear-gradient(to right, #ef4444, #b91c1c);
      color: white;
    }

    /* Main content */
    .main-content {
      margin-left: 280px; /* updated to match sidebar */
      padding: 2.5rem;
      flex: 1;
      overflow-y: auto;
      height: 100vh;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-radius: 0;
        box-shadow: none;
      }
      .main-content {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
  <img src="logo.png" alt="Logo" class="sidebar-logo">
  <nav class="mt-4 w-100">
    <button class="nav-link" (click)="goTo('upload')">1. Upload Dataset</button>
    <button class="nav-link" (click)="goTo('cleaning')">2. Cleaning</button>
    <button class="nav-link" (click)="goTo('validation')">3. Syntax Check & Validation</button>
    <button class="nav-link" (click)="goTo('correction')">4. Correction & Suggestions</button>
    <button class="nav-link" (click)="goTo('linkedinsearch')">5. LinkedIn Search Profiles</button>
    <button class="nav-link" (click)="goTo('enrichment')">6. Enrichment (Search for Alternatives)</button>
    <button class="nav-link" (click)="goTo('profile')">Profile</button>
    <button class="nav-link" (click)="logout()">Logout</button>
  </nav>
</div>

  
<!-- Main Content -->
<div class="main-content">
  <h2 class="fw-bold text-gray-800 mb-4">Email Validation Dashboard</h2>

  <!-- Angular Router Outlet -->
  <router-outlet></router-outlet>
</div>



  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
