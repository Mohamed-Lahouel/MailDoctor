<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom right, #6b7280, #9ca3af, #d1d5db);
      font-family: 'Segoe UI', sans-serif;
    }

    .login-card {
      background: rgba(243, 244, 246, 0.95);
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgba(0,0,0,0.25);
      max-width: 900px;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
    }

    /* Image side */
    .login-card .image-side {
      flex: 1 1 45%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-color: #f3f4f6;
    }

    .login-card .image-side img {
      width: 100%;
      max-width: 550px; /* bigger image */
      border-radius: 0.75rem;
      object-fit: cover;
    }

    /* Form side */
    .login-card .form-side {
      flex: 1 1 55%;
      padding: 2.5rem;
    }

    .btn-gradient {
      background: linear-gradient(to right, #ef4444, #b91c1c);
      color: white;
    }

    .btn-gradient:hover {
      transform: scale(1.05);
      transition: transform 0.3s;
    }

    .text-accent {
      color: #ef4444;
    }

    hr {
      border-color: #9ca3af;
    }

    label {
      color: #374151;
    }

    .form-control {
      background-color: #f9fafb;
      border: 1px solid #d1d5db;
    }

    .form-control:focus {
      border-color: #9ca3af;
      box-shadow: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .login-card {
        flex-direction: column;
      }
      .login-card .image-side {
        display: block;  /* show image on small screens */
        width: 100%;
        padding: 1rem;
      }
      .login-card .image-side img {
        max-width: 100%;
        height: auto;    /* maintain aspect ratio */
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Image side -->
    <div class="image-side">
      <img src="image.png" alt="Login Illustration">
    </div>

    <!-- Form side -->
    <div class="form-side">
      <h2 class="text-center mb-3 fw-bold text-gray-800">Sign In</h2>
      <p class="text-center text-gray-600 mb-4">Welcome back! Please enter your details</p>

      <!-- Email -->
      <div class="mb-3">
  <label class="form-label">Email</label>
  <input type="email" class="form-control" placeholder="Enter your email"
         [(ngModel)]="email" name="email">
</div>

      <!-- Password -->
      <div class="mb-3">
  <label class="form-label">Password</label>
  <input type="password" class="form-control" placeholder="Enter your password"
         [(ngModel)]="password" name="password">
</div>

      <!-- Remember + Forgot -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label" for="rememberMe">
            Remember me
          </label>
        </div>
        <a href="forgotpassword" class="text-accent fw-semibold">Forgot Password?</a>
      </div>

      <!-- Sign In Button -->
      <button class="btn btn-gradient w-100 fw-bold mb-4 py-2"
        (click)="onLogin()">Sign In</button>

      <!-- Divider -->
      <div class="d-flex align-items-center mb-4">
        <hr class="flex-grow-1">
        <span class="px-2 text-gray-500">OR</span>
        <hr class="flex-grow-1">
      </div>

      <!-- Sign Up -->
      <p class="text-center text-gray-600 mb-0">
        Don’t have an account?
        <a href="signup" class="text-accent fw-semibold">Sign up</a>
      </p>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
