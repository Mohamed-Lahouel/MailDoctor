<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom right, #6b7280, #9ca3af, #d1d5db);
      font-family: 'Segoe UI', sans-serif;
    }

    .auth-card {
      display: flex;
      flex-wrap: wrap;
      background: rgba(243, 244, 246, 0.95);
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgba(0,0,0,0.25);
      max-width: 900px;
      width: 100%;
      overflow: hidden;
    }

    /* Image side */
    .auth-card .image-side {
      flex: 1 1 45%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-color: #f3f4f6;
    }

    .auth-card .image-side img {
      width: 100%;
      max-width: 550px;
      border-radius: 0.75rem;
      object-fit: cover;
    }

    /* Form side */
    .auth-card .form-side {
      flex: 1 1 55%;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-side h2 {
      font-weight: bold;
      margin-bottom: 1rem;
      color: #1f2937; /* gray-800 */
      text-align: center;
    }

    .form-side p {
      color: #4b5563; /* gray-600 */
      text-align: center;
      margin-bottom: 2rem;
    }

    label {
      color: #374151;
    }

    .form-control {
      background-color: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
    }

    .form-control:focus {
      border-color: #9ca3af;
      box-shadow: none;
    }

    .btn-gradient {
      background: linear-gradient(to right, #ef4444, #b91c1c);
      color: white;
      font-weight: bold;
    }

    .btn-gradient:hover {
      transform: scale(1.05);
      transition: transform 0.3s;
    }

    .text-accent {
      color: #ef4444;
      font-weight: 600;
      cursor: pointer;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .auth-card {
        flex-direction: column;
      }
      .auth-card .image-side {
        display: block;
        width: 100%;
        padding: 1rem;
      }
      .auth-card .image-side img {
        max-width: 100%;
        height: auto;
        border-radius: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <!-- Image side -->
    <div class="image-side">
      <img src="image.png" alt="Forgot Password Illustration">
    </div>

    <!-- Form side -->
    <div class="form-side">
      <h2>Forgot Password</h2>
      <p>Enter your email to reset your password</p>

      <div class="mb-4">
  <label for="email" class="form-label">Email</label>
  <input type="email" class="form-control" id="email" placeholder="Enter your email" [(ngModel)]="email">
</div>

<button class="btn btn-gradient w-100 mb-4 py-2" (click)="resetPassword()">Reset Password</button>

      <div class="text-center text-gray-500">
        Remembered your password?
        <span class="text-accent" onclick="location.href='#'">Log in</span>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
