<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg border-0 rounded-3">
        <div class="card-body p-4">

          <!-- Title -->
          <h2 class="fw-bold text-center mb-4 text-danger">
            Hunter.io Email Finder
          </h2>

          <!-- Search Inputs -->
          <div class="mb-3">
            <label class="form-label fw-semibold">First Name</label>
            <input type="text" class="form-control" [(ngModel)]="firstName" placeholder="Enter first name">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Last Name</label>
            <input type="text" class="form-control" [(ngModel)]="lastName" placeholder="Enter last name">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Domain / Company</label>
            <input type="text" class="form-control" [(ngModel)]="domain" placeholder="example.com">
          </div>

          <!-- Search Button -->
          <button class="btn btn-danger w-100 mt-2" (click)="findEmail()" [disabled]="loading">
            🔍 Find Email
          </button>

          <!-- Loading Indicator -->
          <div *ngIf="loading" class="mt-3 text-center">
            <span class="text-danger fw-bold">Loading...</span>
          </div>

          <!-- Error Message -->
          <div *ngIf="errorMessage" class="alert alert-danger mt-3">
            {{ errorMessage }}
          </div>

          <!-- Result -->
          <div *ngIf="foundEmail" class="alert alert-success mt-3">
            <strong>✅ Email Found!</strong> <br>
            <span>{{ foundEmail }}</span> <br>
            <small *ngIf="score">Confidence Score: {{ score }}%</small><br>
            <small *ngIf="position">Position: {{ position }}</small><br>
            <small *ngIf="company">Company: {{ company }}</small>
          </div>

          <!-- Select Dataset File -->
          <div class="mb-3" *ngIf="foundEmail">
            <label for="datasetFile" class="form-label fw-semibold">Choose Dataset File</label>
            <select id="datasetFile" class="form-select" [(ngModel)]="selectedDatasetFile">
              <option *ngFor="let file of uploadedFiles" [value]="file">{{ file }}</option>
            </select>
          </div>

          <!-- Add to Dataset Button -->
          <button class="btn btn-success w-100 mt-2" 
                  (click)="addToDatasetFile()" 
                  [disabled]="!foundEmail || !selectedDatasetFile">
            💾 Add to Selected Dataset
          </button>

          <!-- Optional Saved Dataset -->
          <div *ngIf="dataset.length" class="mt-4">
            <label class="form-label fw-semibold">Saved Emails</label>
            <ul class="list-group">
              <li class="list-group-item" *ngFor="let item of dataset">
                {{ item.firstName }} {{ item.lastName }} → {{ item.email }} ({{ item.company }})
              </li>
            </ul>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
