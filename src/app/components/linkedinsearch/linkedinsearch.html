<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="card shadow-lg border-0 rounded-3" style="background-color: #fff5f5;">
        <div class="card-body p-5">

          <h2 class="fw-bold text-center mb-4 text-dark border-bottom pb-3">
            LinkedIn Profile Search
          </h2>

          <!-- Search Input -->
          <div class="mb-3">
            <label class="form-label fw-semibold text-danger">Name / Keyword</label>
            <input type="text" class="form-control border-danger"
                   [(ngModel)]="searchTerm"
                   placeholder="Enter name or keyword">
          </div>

          <!-- Search Button -->
          <button class="btn btn-danger mt-3"
                  (click)="fetchLinkedInUrls()"
                  [disabled]="!searchTerm || loading">
            🔍 Search Profiles
          </button>

          <!-- Loading -->
          <div *ngIf="loading" class="mt-3 text-center">
            <span class="text-danger fw-bold">Loading...</span>
          </div>

          <!-- Error Message -->
          <div class="alert alert-danger mt-4" *ngIf="errorMessage">{{ errorMessage }}</div>

          <!-- LinkedIn Results Table -->
          <div *ngIf="linkedinResults.length" class="mt-4">
            <table class="table table-bordered table-hover">
              <thead class="table-danger">
                <tr>
                  <th>Rank</th>
                  <th>Info</th>
                  <th>LinkedIn URL</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let result of linkedinResults">
                  <td>{{ result.rank }}</td>
                  <td>{{ result.info }}</td>
                  <td><a [href]="result.url" target="_blank">{{ result.url }}</a></td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
